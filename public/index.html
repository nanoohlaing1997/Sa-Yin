<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Home-screen icon and name on iPhone / iPad ("Add to Home Screen"). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Sa Yin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Standard status bar: "black-translucent" makes iOS size the page
         short by the status-bar height, leaving a gap under the tab bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Android / desktop install. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F3F4F8" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Same white as the tab bar, so if iOS ever sizes the page a little
           short, the area under the tab bar blends in instead of showing a strip. */
        background-color: #FFFFFF;
      }
      /* Desktop: grey surround for the centred phone-width column. */
      @media (min-width: 431px) {
        html,
        body {
          background-color: #E9E9EF;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Pinned so iOS can't leave the page shifted after the keyboard closes. */
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // iOS scrolls the page up to keep a focused field above the keyboard and
      // doesn't always scroll back, leaving a blank strip at the bottom.
      document.addEventListener('focusout', function () {
        setTimeout(function () {
          var el = document.activeElement;
          if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) window.scrollTo(0, 0);
        }, 60);
      });
    </script>
  </body>
</html>
